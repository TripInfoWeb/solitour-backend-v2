services:
  # ────────────── MySQL Master ──────────────
  mysql-master:
    image: mysql:5.7
    container_name: mysql-master
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: masterpass
      MYSQL_DATABASE: solitour
      MYSQL_USER: soli
      MYSQL_PASSWORD: 1234
    command: >
      --server-id=1 
      --log-bin=mysql-bin 
      --binlog-format=ROW 
      --character-set-server=utf8mb4 
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - master-data:/var/lib/mysql
    networks:
      - proxynet

  # ────────────── MySQL Replica ──────────────
  mysql-replica:
    image: mysql:5.7
    container_name: mysql-replica
    restart: unless-stopped
    depends_on:
      - mysql-master
    environment:
      MYSQL_ROOT_PASSWORD: replpass
      MYSQL_DATABASE: solitour
      MYSQL_USER: soli
      MYSQL_PASSWORD: 1234
    command: >
      --server-id=2 
      --relay-log=relay-bin 
      --read-only=1 
      --character-set-server=utf8mb4 
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - replica-data:/var/lib/mysql
    networks:
      - proxynet

  # ────────────── ProxySQL Frontend ──────────────
  proxysql:
    image: proxysql/proxysql:2.5.1
    container_name: proxysql
    restart: unless-stopped
    depends_on:
      - mysql-master
      - mysql-replica
    ports:
      - "6032:6032"   # Admin interface
      - "6033:6033"   # Client interface
    volumes:
      - ./proxysql.cnf:/etc/proxysql.cnf
      - proxysql-data:/var/lib/proxysql
    networks:
      - proxynet

volumes:
  master-data:
  replica-data:
  proxysql-data:
  proxysql.cnf:
    driver: local

networks:
  proxynet:
    driver: bridge
